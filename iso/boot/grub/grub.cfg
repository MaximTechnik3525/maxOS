font=video
if loadfont /boot/grub/fonts/unicode.pf2 ; then
    insmod vbe
    insmod vga
    insmod gfxterm
    insmod video_all
    set gfxmode=1024x768
    local_video
    terminal_output gfxterm
fi

set timeout=3
set default=0
set gfxpayload=keep

insmod part_msdos
insmod fat
insmod ext2

set gfxmode=1024x768x16
set gfxpayload=keep

menuentry "maxOS 3.9" {
    search --no-floppy --set=root --file /boot/mykernel.bin
    multiboot /boot/mykernel.bin
    boot
}
